<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>맛집 정보 수정</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Pretendard', sans-serif; }
        .edit-container { max-width: 600px; margin: 50px auto; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .card-header { background-color: #ffc107; border-radius: 15px 15px 0 0 !important; color: #fff; text-align: center; padding: 20px; }
        .form-label { color: #555; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #ddd; padding: 10px 15px; transition: all 0.3s; }
        .form-control:focus, .form-select:focus { border-color: #ffc107; box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25); }
        .btn-update { background-color: #ffc107; border: none; color: white; font-weight: bold; transition: 0.3s; }
        .btn-update:hover { background-color: #e0a800; transform: translateY(-2px); }
        .btn-cancel { border-radius: 8px; font-weight: 500; }
        textarea { resize: none; }
    </style>
</head>
<body>

<div class="container edit-container">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">🍴 맛집 정보 수정</h3>
            <small>기록된 미식 경험을 수정합니다</small>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/food/edit}" th:object="${food}" method="post">
                <!-- ID 숨김 처리 -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">😋 음식 이름</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="예: 남포동 비빔당면" required>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">📂 카테고리</label>
                        <select th:field="*{category}" class="form-select">
                            <option value="한식">🇰🇷 한식</option>
                            <option value="일식">🇯🇵 일식</option>
                            <option value="중식">🇨🇳 중식</option>
                            <option value="양식">🇺🇸 양식</option>
                            <option value="기타">🍛 기타</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">⭐ 별점</label>
                        <select th:field="*{rating}" class="form-select">
                            <option th:each="i : ${#numbers.sequence(5, 1)}" 
                                    th:value="${i}" 
                                    th:text="${i == 5 ? '⭐⭐⭐⭐⭐ (최고)' : i + '점'}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">📅 방문일자</label>
                    <input type="date" th:field="*{eatDate}" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">📝 맛 평점 및 메모</label>
                    <textarea th:field="*{memo}" class="form-control" rows="4" placeholder="맛은 어땠나요? 다시 방문하고 싶은가요?"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-update btn-lg">수정 완료</button>
                    <a th:href="@{/food/list}" class="btn btn-outline-secondary btn-cancel">취소하고 돌아가기</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
