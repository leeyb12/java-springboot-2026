<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘 뭐 먹었지?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">🍴 먹방 기록장</h2>
        <a th:href="@{/food/add}" class="btn btn-primary">+ 새 기록</a>
    </div>

    <!-- 검색창 -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/food/list}" method="get" class="row g-2">
                <div class="col-md-3">
                    <select name="category" class="form-select">
                        <option value="">전체 카테고리</option>
                        <option value="한식" th:selected="${category == '한식'}">한식</option>
                        <option value="일식" th:selected="${category == '일식'}">일식</option>
                        <option value="중식" th:selected="${category == '중식'}">중식</option>
                        <option value="양식" th:selected="${category == '양식'}">양식</option>
                        <option value="기타" th:selected="${category == '기타'}">기타</option>
                    </select>
                </div>
                <div class="col-md-7">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="음식명 또는 메모 검색">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-secondary">검색</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 테이블 -->
    <div class="table-responsive shadow-sm bg-white rounded">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th class="ps-3">날짜</th><th>음식명</th><th>별점</th><th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="food : ${pageResponse.content}">
                    <td class="ps-3" th:text="${food.eatDate}"></td>
                    <td><span class="badge bg-light text-dark me-1" th:text="${food.category}"></span> <strong th:text="${food.name}"></strong></td>
                    <td class="text-warning">
                        <span th:each="i : ${#numbers.sequence(1, food.rating)}">★</span>
                    </td>
                    <td>
                        <a th:href="@{/food/edit/{id}(id=${food.id})}" class="btn btn-sm btn-outline-info">수정</a>
                        <a th:href="@{/food/delete/{id}(id=${food.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('삭제할까요?')">삭제</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이징 -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!pageResponse.hasPrev} ? 'disabled'">
                <a class="page-link" th:href="@{/food/list(page=${pageResponse.startPage - 1}, keyword=${keyword}, category=${category})}">이전</a>
            </li>
            <li class="page-item" th:each="num : ${#numbers.sequence(pageResponse.startPage, pageResponse.endPage)}" 
                th:classappend="${num == pageResponse.currentPage} ? 'active'">
                <a class="page-link" th:href="@{/food/list(page=${num}, keyword=${keyword}, category=${category})}" th:text="${num}"></a>
            </li>
            <li class="page-item" th:classappend="${!pageResponse.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/food/list(page=${pageResponse.endPage + 1}, keyword=${keyword}, category=${category})}">다음</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
