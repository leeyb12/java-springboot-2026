<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.movieId == null ? '영화 등록' : '영화 수정'}">영화 폼</title>
    <style>
        .form-container { 
          max-width: 600px; 
          margin: 20px auto; 
        }
        .form-group { 
          margin-bottom: 15px; 
        }
        label { 
          display: block; 
          margin-bottom: 5px; 
          font-weight: bold;
        }
        input[type="text"], 
        input[type="number"], 
        input[type="date"], 
        textarea {
          width: 100%; 
          padding: 8px; 
          border: 1px solid #ccc; 
          border-radius: 4px; 
          box-sizing: border-box;
        }
        .button-group {
          display: flex;
          gap: 10px;           
          justify-content: center; 
          align-items: center; 
        }

        .btn-submit, .btn-cancel { 
          padding: 10px 20px; 
          border: none; 
          border-radius: 4px; 
          cursor: pointer;
          font-size: 14px;      
          text-decoration: none; 
          display: inline-block; 
          text-align: center;    
          line-height: normal;   
        }

        .btn-submit { 
          background-color: #28a745; 
          color: white; 
        }

        .btn-cancel { 
          background-color: #6c757d; 
          color: white; 
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 th:text="${movie.movieId == null ? '새 영화 등록' : '영화 정보 수정'}">영화 정보</h1>
        
        <form th:action="@{${movie.movieId == null ? '/movies/add' : '/movies/edit'}}" th:object="${movie}" method="post">
            <input type="hidden" th:field="*{movieId}" />
            
            <div class="form-group">
                <label>제목:</label>
                <input type="text" th:field="*{title}" required />
            </div>
            
            <div class="form-group">
                <label>원제:</label>
                <input type="text" th:field="*{originalTitle}" />
            </div>
            
            <div class="form-group">
                <label>감독:</label>
                <input type="text" th:field="*{director}" />
            </div>
            
            <div class="form-group">
                <label>배우:</label>
                <input type="text" th:field="*{actors}" />
            </div>
            
            <div class="form-group">
                <label>장르:</label>
                <input type="text" th:field="*{genre}" />
            </div>
            
            <div class="form-group">
                <label>개봉일:</label>
                <input type="date" th:field="*{releaseDate}" />
            </div>
            
            <div class="form-group">
                <label>상영시간(분):</label>
                <input type="number" th:field="*{runningTime}" />
            </div>
            
            <div class="form-group">
                <label>평점:</label>
                <input type="number" step="0.1" th:field="*{rating}" />
            </div>
            
            <div class="form-group">
                <label>설명:</label>
                <textarea th:field="*{description}" rows="5"></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-submit" th:text="${movie.movieId == null ? '등록' : '수정'}">저장</button>
                <a th:href="@{/movies}" class="btn-cancel" onclick="return confirm('작성 중인 내용이 저장되지 않습니다. 취소하시겠습니까?');">
                 취소
                </a>
            </div>
        </form>
    </div>
</body>
</html>
